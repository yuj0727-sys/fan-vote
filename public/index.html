<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>팬 투표 실시간 순위</title>
    <style>
      :root {
        color-scheme: light;
        --text: #1c1917;
        --muted: #57534e;
        --line: #e7e5e4;
        --bg: #fafaf9;
        --surface: #ffffff;
        --ok: #166534;
        --warn: #9a3412;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
      }

      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 650;
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
      }

      .connection-status {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0;
        color: var(--muted);
        font-size: 0.875rem;
      }

      .connection-status::before {
        content: '';
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #a8a29e;
      }

      .connection-status.is-connected {
        color: var(--ok);
      }

      .connection-status.is-connected::before {
        background: #16a34a;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--line);
      }

      th,
      td {
        padding: 0.6rem 0.75rem;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      th {
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 600;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .number {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      tr.is-updated {
        animation: row-highlight 1.4s ease;
      }

      @keyframes row-highlight {
        from {
          background: #fef3c7;
        }
        to {
          background: transparent;
        }
      }

      .vote-panel {
        margin-top: 2rem;
      }

      .user-picker {
        color: var(--muted);
        font-size: 0.875rem;
      }

      select,
      button {
        font: inherit;
      }

      select {
        margin-left: 0.4rem;
        padding: 0.25rem 0.4rem;
      }

      .artist-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.75rem 0 0;
        padding: 0;
        list-style: none;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 0.375rem;
        background: var(--surface);
        padding: 0.4rem 0.7rem;
        cursor: pointer;
      }

      button:hover {
        border-color: #d6d3d1;
      }

      button:disabled {
        cursor: default;
        opacity: 0.6;
      }

      button:focus-visible,
      select:focus-visible {
        outline: 2px solid #44403c;
        outline-offset: 2px;
      }

      .vote-result {
        min-height: 1.5rem;
        margin: 0.75rem 0 0;
        font-size: 0.875rem;
      }

      .vote-result.is-success {
        color: var(--ok);
      }

      .vote-result.is-conflict {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>팬 투표 실시간 순위</h1>
        <p id="connection-status" class="connection-status">끊김</p>
      </header>

      <table>
        <thead>
          <tr>
            <th class="number" scope="col">순위</th>
            <th scope="col">이름</th>
            <th class="number" scope="col">득표수</th>
          </tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>

      <section class="vote-panel">
        <h2>투표</h2>
        <label class="user-picker" for="user-id">
          유저
          <select id="user-id"></select>
        </label>
        <ul id="artist-list" class="artist-list"></ul>
        <p id="vote-result" class="vote-result" aria-live="polite"></p>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const rankingBody = document.querySelector('#ranking-body');
      const connectionStatus = document.querySelector('#connection-status');
      const userSelect = document.querySelector('#user-id');
      const artistList = document.querySelector('#artist-list');
      const voteResult = document.querySelector('#vote-result');

      const userIdOptions = Array.from({ length: 10 }, (_, index) => index + 1);
      let previousRankings = null;
      let voteResultTimer = null;
      let voteRequestInFlight = false;

      for (const userId of userIdOptions) {
        const option = document.createElement('option');
        option.value = String(userId);
        option.textContent = `유저 ${userId}`;
        userSelect.append(option);
      }

      const rankingsSocket = io('/rankings');
      rankingsSocket.on('connect', () => {
        setConnectionStatus(true);
      });
      rankingsSocket.on('disconnect', () => {
        setConnectionStatus(false);
      });
      rankingsSocket.on('ranking:snapshot', renderRankings);
      rankingsSocket.on('ranking:updated', renderRankings);

      loadArtists();

      function setConnectionStatus(connected) {
        connectionStatus.textContent = connected ? '연결됨' : '끊김';
        connectionStatus.classList.toggle('is-connected', connected);
      }

      function renderRankings(rankings) {
        const previousByArtistId = new Map(
          (previousRankings ?? []).map((ranking) => [ranking.artistId, ranking]),
        );

        rankingBody.replaceChildren();
        if (!Array.isArray(rankings) || rankings.length === 0) {
          const emptyRow = document.createElement('tr');
          const emptyCell = document.createElement('td');
          emptyCell.colSpan = 3;
          emptyCell.textContent = '표시할 순위가 없습니다.';
          emptyRow.append(emptyCell);
          rankingBody.append(emptyRow);
          previousRankings = [];
          return;
        }

        for (const ranking of rankings) {
          const previousRanking = previousByArtistId.get(ranking.artistId);
          const rankingChanged =
            previousRankings !== null &&
            (previousRanking === undefined ||
              previousRanking.rank !== ranking.rank ||
              previousRanking.voteCount !== ranking.voteCount);

          const row = document.createElement('tr');
          if (rankingChanged) {
            row.classList.add('is-updated');
          }

          const rankCell = document.createElement('td');
          rankCell.className = 'number';
          rankCell.textContent = String(ranking.rank);

          const nameCell = document.createElement('td');
          nameCell.textContent = ranking.name;

          const voteCountCell = document.createElement('td');
          voteCountCell.className = 'number';
          voteCountCell.textContent = String(ranking.voteCount);

          row.append(rankCell, nameCell, voteCountCell);
          rankingBody.append(row);
        }

        previousRankings = rankings;
      }

      async function loadArtists() {
        const response = await fetch('/artists');
        if (!response.ok) {
          showVoteResult('아티스트 목록을 불러오지 못했습니다.', 'is-conflict');
          return;
        }

        const artists = await response.json();
        artistList.replaceChildren();
        for (const artist of artists) {
          const item = document.createElement('li');
          const voteButton = document.createElement('button');
          voteButton.type = 'button';
          voteButton.textContent = `${artist.name} 투표`;
          voteButton.addEventListener('click', () => {
            void voteForArtist(artist);
          });
          item.append(voteButton);
          artistList.append(item);
        }
      }

      async function voteForArtist(artist) {
        if (voteRequestInFlight) {
          return;
        }

        voteRequestInFlight = true;
        setVoteButtonsDisabled(true);
        try {
          const response = await fetch('/votes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              userId: Number(userSelect.value),
              artistId: artist.id,
            }),
          });

          if (response.status === 201) {
            showVoteResult(`${artist.name}에게 투표했습니다.`, 'is-success');
            return;
          }

          if (response.status === 409) {
            const errorBody = await response.json();
            const message =
              typeof errorBody.message === 'string'
                ? errorBody.message
                : '오늘 이미 이 아티스트에게 투표했습니다.';
            showVoteResult(message, 'is-conflict');
            return;
          }

          showVoteResult('투표에 실패했습니다.', 'is-conflict');
        } catch {
          showVoteResult('투표 요청을 보내지 못했습니다.', 'is-conflict');
        } finally {
          voteRequestInFlight = false;
          setVoteButtonsDisabled(false);
        }
      }

      function setVoteButtonsDisabled(disabled) {
        for (const button of artistList.querySelectorAll('button')) {
          button.disabled = disabled;
        }
      }

      function showVoteResult(message, statusClassName) {
        if (voteResultTimer !== null) {
          clearTimeout(voteResultTimer);
        }
        voteResult.textContent = message;
        voteResult.className = `vote-result ${statusClassName}`;
        voteResultTimer = setTimeout(() => {
          voteResult.textContent = '';
          voteResult.className = 'vote-result';
          voteResultTimer = null;
        }, 2500);
      }
    </script>
  </body>
</html>
